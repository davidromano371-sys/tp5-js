<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicios JavaScript - DOM y BOM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <h1 class="text-center">Ejercicios JavaScript</h1>
    <p class="text-center text-muted mb-5">Prácticas con DOM y BOM</p>

    <!-- Ejercicio 1: Números mágicos -->
    <section id="ejercicio-1" class="card p-4 mb-4">
      <h2 class="h4">1. Números mágicos</h2>
      <div class="mb-3">
        <button id="btnComenzar" class="btn btn-primary">Comenzar juego</button>
      </div>
      <div class="input-group">
        <input type="number" id="inputNumero" class="form-control" placeholder="Ingresá un número">
        <button id="btnEnviar" class="btn btn-success">Enviar</button>
      </div>
    </section>

    <!-- Ejercicio 2: Generaciones (clase Persona) -->
    <section id="ejercicio-2" class="card p-4 mb-4">
      <h2 class="h4">2. Generaciones</h2>
      <form id="formPersona" class="row g-3">
        <div class="col-md-6">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" class="form-control">
        </div>
        <div class="col-md-3">
          <label for="edad" class="form-label">Edad</label>
          <input type="number" id="edad" class="form-control">
        </div>
        <div class="col-md-3">
          <label for="dni" class="form-label">DNI</label>
          <input type="text" id="dni" class="form-control">
        </div>
        <div class="col-md-3">
          <label for="sexo" class="form-label">Sexo</label>
          <select id="sexo" class="form-select">
            <option value="H">Hombre</option>
            <option value="M">Mujer</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="peso" class="form-label">Peso (kg)</label>
          <input type="number" id="peso" class="form-control" step="0.1">
        </div>
        <div class="col-md-3">
          <label for="altura" class="form-label">Altura (m)</label>
          <input type="number" id="altura" class="form-control" step="0.01">
        </div>
        <div class="col-md-3">
          <label for="anioNacimiento" class="form-label">Año de nacimiento</label>
          <input type="number" id="anioNacimiento" class="form-control">
        </div>
        <div class="col-12 d-flex flex-wrap gap-2">
          <button type="button" id="btnGeneracion" class="btn btn-primary">Mostrar generación</button>
          <button type="button" id="btnMayorEdad" class="btn btn-secondary">Es mayor de edad</button>
          <button type="button" id="btnMostrarDatos" class="btn btn-info">Mostrar datos</button>
        </div>
      </form>
    </section>

    <!-- Ejercicio 3: Lista de tareas -->
    <section id="ejercicio-3" class="card p-4 mb-4">
      <h2 class="h4">3. Lista de tareas</h2>
      <div class="input-group mb-3">
        <input type="text" id="inputTarea" class="form-control" placeholder="Escribí una tarea">
        <button id="btnAgregarTarea" class="btn btn-primary">Agregar</button>
      </div>
      <ul id="listaTareas" class="list-group"></ul>
    </section>

    <!-- Ejercicio 4: Reloj -->
    <section id="ejercicio-4" class="card p-4 mb-4 text-center">
      <h2 class="h4">4. Reloj</h2>
      <div id="fechaReloj" class="fs-5"></div>
      <div id="horaReloj" class="display-3 fw-bold"></div>
    </section>

    <!-- Ejercicio 5: Cronómetro -->
    <section id="ejercicio-5" class="card p-4 mb-4 text-center">
      <h2 class="h4">5. Cronómetro</h2>
      <div id="displayCrono" class="display-3 fw-bold mb-3">00:00:00</div>
      <div class="d-flex justify-content-center gap-2">
        <button id="btnIniciarCrono" class="btn btn-success">Iniciar</button>
        <button id="btnPausarCrono" class="btn btn-warning">Pausar</button>
        <button id="btnResetCrono" class="btn btn-danger">Reset</button>
      </div>
    </section>

    <!-- Ejercicio 6: Temporizador -->
    <section id="ejercicio-6" class="card p-4 mb-4 text-center">
      <h2 class="h4">6. Temporizador</h2>
      <div class="row justify-content-center g-2 mb-3">
        <div class="col-6 col-md-3">
          <input type="number" id="inputMinutos" class="form-control" placeholder="Minutos" min="0">
        </div>
        <div class="col-6 col-md-3">
          <input type="number" id="inputSegundos" class="form-control" placeholder="Segundos" min="0" max="59">
        </div>
      </div>
      <div id="displayTemporizador" class="display-3 fw-bold mb-3">00:00</div>
      <div class="d-flex justify-content-center gap-2">
        <button id="btnIniciarTemp" class="btn btn-success">Iniciar</button>
        <button id="btnPausarTemp" class="btn btn-warning">Pausar</button>
        <button id="btnResetTemp" class="btn btn-danger">Reset</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Scripts de cada ejercicio -->
  <!-- <script src="js/ejercicio-1.js"></script> -->

  <!-- <script src="js/ejercicio-3.js"></script> -->
  <!-- <script src="js/ejercicio-4.js"></script> -->
  <!-- <script src="js/ejercicio-5.js"></script> -->
  <script src="js/ejercicio-6.js"></script>
</body>
</html>
